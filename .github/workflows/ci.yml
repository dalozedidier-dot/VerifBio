name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Black (format check)
        run: |
          python -m black --check .

      - name: Pytest
        run: |
          pytest -q

      - name: EchoBio CLI smoke
        run: |
          mkdir -p _ci_out
          echobio audit examples/brca1_parp.yaml --out _ci_out/echobio_report.json
          echobio export _ci_out/echobio_report.json --format markdown --out _ci_out/echobio_report.md

      - name: Upload EchoBio report
        uses: actions/upload-artifact@v4
        with:
          name: echobio_report_py${{ matrix.python-version }}
          path: |
            _ci_out/echobio_report.json
            _ci_out/echobio_report.md
          if-no-files-found: error
