name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Black format check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Black (format check)
        run: |
          set -euo pipefail
          paths=()
          for p in src scripts tests; do
            if [ -d "$p" ]; then
              paths+=("$p")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No known source dirs found; falling back to repo-wide check."
            python -m black --check .
          else
            echo "Running black on: ${paths[*]}"
            python -m black --check "${paths[@]}"
          fi

  tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke import
        run: |
          python -c "import echobio; print('import-ok')"

      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d "tests" ] && find tests -type f -name "test_*.py" | grep -q .; then
            pytest -q
          else
            echo "No tests found. Skipping pytest."
          fi
