name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Black format check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Debug quick
        if: always()
        run: |
          set +e
          echo "=== debug: versions ==="
          python -V
          python -m pip -V
          python -m black --version || echo "black missing"
          python -m pytest --version || echo "pytest missing"
          echo ""
          echo "=== debug: repo tree (top) ==="
          ls -la
          echo ""
          echo "=== debug: src/tests/scripts ==="
          ls -la src 2>/dev/null || true
          ls -la tests 2>/dev/null || true
          ls -la scripts 2>/dev/null || true
          echo ""
          echo "=== debug: pip list (top 40) ==="
          python -m pip list | head -n 40 || true
          echo ""
          echo "=== debug: black target dirs ==="
          for p in src scripts tests; do
            if [ -d "$p" ]; then
              echo "DIR: $p"
              find "$p" -maxdepth 2 -type f | head -n 40
            fi
          done

      - name: Black (format check)
        run: |
          set -euo pipefail
          paths=()
          for p in src scripts tests; do
            if [ -d "$p" ]; then
              paths+=("$p")
            fi
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No known source dirs found; falling back to repo-wide check."
            python -m black --check .
          else
            echo "Running black on: ${paths[*]}"
            python -m black --check "${paths[@]}"
          fi

  tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Debug quick
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set +e
          echo "=== debug: versions ==="
          python -V
          python -m pip -V
          python -m black --version || echo "black missing"
          python -m pytest --version || echo "pytest missing"
          echo ""
          echo "=== debug: sys.path + import probe ==="
          python - <<'PY'
          import sys, importlib
          print("PYTHONPATH:", "src")
          print("sys.path[0:8]:", sys.path[:8])
          for name in ("verifbio", "echobio"):
              try:
                  m = importlib.import_module(name)
                  print("import-ok:", name, "->", getattr(m, "__file__", None))
              except Exception as e:
                  print("import-fail:", name, type(e).__name__, str(e))
          PY
          echo ""
          echo "=== debug: repo dirs ==="
          ls -la
          ls -la src 2>/dev/null || true
          ls -la tests 2>/dev/null || true

      - name: Smoke import (prefer verifbio)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import importlib

          tried = []
          for name in ("verifbio", "echobio"):
              try:
                  m = importlib.import_module(name)
                  print("import-ok:", name, "->", getattr(m, "__file__", None))
                  break
              except ModuleNotFoundError as e:
                  tried.append((name, "ModuleNotFoundError", str(e)))
              except Exception as e:
                  tried.append((name, type(e).__name__, str(e)))
          else:
              msg = "Neither verifbio nor echobio could be imported. Tried: " + repr(tried)
              raise SystemExit(msg)
          PY

      - name: Pytest (if tests exist)
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ -d "tests" ] && find tests -type f -name "test_*.py" | grep -q .; then
            pytest -q
          else
            echo "No tests found. Skipping pytest."
          fi
