[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echobio"
version = "0.2.3"
description = "EchoBio audits biological hypothesis specification quality (not truth)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EchoBio contributors"}]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0"
]

[project.scripts]
echobio = "echobio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["echobio"]

[tool.black]
line-length = 88
target-version = ["py311"]
